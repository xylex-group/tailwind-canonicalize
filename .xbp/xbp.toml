project_name = "tailwind-canonicalize"
version = "0.1.0"
port = 3000
build_dir = "./"
app_type = "library-node"
build_command = "pnpm run build"
install_command = "pnpm install"
target = "library-node"
branch = "main"
version_targets = [
    "action/package.json",
    "apps/docs/package.json",
    "package.json",
    "packages/cli/package.json",
    "packages/compiler/package.json",
    "packages/parser/package.json",
    "packages/resolver/package.json",
    "packages/tokens/package.json",
    "packages/transformer/package.json",
    "packages/vscode/package.json",
]
version_domains = []
ignore_paths = []
watch_ignore_paths = []
versioning_disabled = [
    "public",
    "apps/docs/public",
    "tailwind-canonicalize-action",
    "action",
    "tailwind-canonicalize-compiler",
    "packages/compiler",
    "tailwind-canonicalize-parser",
    "packages/parser",
    "tailwind-canonicalize-resolver",
    "packages/resolver",
    "tailwind-canonicalize-tokens",
    "packages/tokens",
]
release_disabled = []

[[services]]
name = "tailwind-canonicalize"
target = "library-node"
branch = "main"
port = 3000
root_directory = "./"
restart_policy = "on_failure"
restart_policy_max_failure_count = 10
start_wrapper = "pm2"
force_run_from_root = false
version_targets = ["package.json"]

[services.commands]
install = "pnpm install"
build = "pnpm run build"
benchmark = "pnpm run benchmark"
changeset = "pnpm run changeset"
check = "pnpm run check"
"deploy:docs" = "pnpm run deploy:docs"
"docs:build" = "pnpm run docs:build"
"docs:cf-typegen" = "pnpm run docs:cf-typegen"
"docs:deploy" = "pnpm run docs:deploy"
"docs:deploy:worker" = "pnpm run docs:deploy:worker"
"docs:dev" = "pnpm run docs:dev"
fix = "pnpm run fix"
format = "pnpm run format"
knip = "pnpm run knip"
lint = "pnpm run lint"
prepare = "pnpm run prepare"
publint = "pnpm run publint"
release = "pnpm run release"
test = "pnpm run test"
"test:coverage" = "pnpm run test:coverage"
"test:watch" = "pnpm run test:watch"
typecheck = "pnpm run typecheck"
version-packages = "pnpm run version-packages"

[services.oci]
image = "registry.xbp.app/xylex-group/tailwind-canonicalize"
tag = "latest"
tag_from = "version"
context = "./"
platforms = ["linux/amd64"]

[services.oci.build_args]

[services.deploy]
provider = "kubernetes"

[services.deploy.destinations]

[services.deploy.envs.production]
namespace = "tailwind-canonicalize"
replicas = 1
health = []

[services.deploy.envs.production.kubernetes]
workload = "tailwind-canonicalize"
service = "tailwind-canonicalize"
selector = "app=tailwind-canonicalize"

