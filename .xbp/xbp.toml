[linear]
default_team_key = "DEV"
organization_name = "suits-formations"

[linear.release]
enabled = true
initiative_ids = ["fd28f67f-8dc8-44b2-bf14-3821ce389145"]
organization_name = "suits-formations"

[github]
repository = "xylex-group/tailwind-canonicalize"

[github.release_branch]
enabled = true
naming_template = "releases/{SERVICE_NAME}-{VERSION}"

[publish.npm]
enabled = true
package_name = "tailwind-canonicalize"
working_directory = "packages/cli"
manifest_path = "packages/cli/package.json"
packages = []
token = "${NPM_TOKEN}"
preflight_commands = []
publish_command = "npm publish --access public"
use_wsl = false
generate_npmrc = true
access = "public"
no_verify_retry_packages = []

[discord]
enabled = true
webhook_url = "${DISCORD_WEBHOOK_URL}"
username = "XBP"

[discord.events]
version_release = true
github_tag = false
github_release = false
crates_io = true
npm = true
linear = true
cargo_dist = true
oci = true
workers_deploy = true
kubernetes_deploy = true
deploy = true
openapi = true
issues = true
commit = true
